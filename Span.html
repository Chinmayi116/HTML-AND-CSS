<!DOCTYPE html>
<html>
<head>
<style>
.a:hover{
color:red;
font-size:25px;
font-family:Arial;
font-style:italic;
}

.b:hover{
color:blue;
font-size:28px;
font-family:Courier New;
font-style:oblique;
}

.c:hover{
color:green;
font-size:30px;
font-family:Georgia;
font-style:italic;
}
</style>
</head>

<body>

<p>
My home is in
<span class="a">a beautiful village</span>.
It has
<span class="b">green trees everywhere</span>.
I enjoy
<span class="c">the peaceful environment</span>.
</p>

</body>
</html>
