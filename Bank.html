<!DOCTYPE html>
<html>
<head>
    <title>Bank Details Form</title>
</head>
<body>

<h2>Bank Details Form</h2>

<form>

    <!-- Personal Details -->
    Name:
    <input type="text" name="name"><br><br>

    Account Number:
    <input type="text" name="accno"><br><br>

    IFSC Code:
    <input type="text" name="ifsc"><br><br>

    Mobile Number:
    <input type="text" name="mobile"><br><br>

    <!-- Radio Button -->
    Account Type:
    <input type="radio" name="account">Savings
    <input type="radio" name="account">Current
    <br><br>

    <!-- Checkbox -->
    Banking Services:
    <input type="checkbox" name="service">ATM
    <input type="checkbox" name="service">Internet Banking
    <input type="checkbox" name="service">Mobile Banking
    <br><br>

    <!-- Password -->
    Password:
    <input type="password" name="pass"><br><br>

    <!-- Submit and Reset -->
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
